name: Online Bookstore CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Unit Tests with Coverage
        run: |
          pytest -v --cov=. --cov-report=term-missing > test_results.txt || true

      - name: Run Performance Tests
        run: |
          python -m perf.perf_measure > perf_results.txt || echo "Performance test skipped"

      - name: Upload Test & Performance Results
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            test_results.txt
            perf_results.txt
